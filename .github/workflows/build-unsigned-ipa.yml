name: Build unsigned iPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build OpenSidecariOS (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project OpenSidecar.xcodeproj \
            -scheme OpenSidecariOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""          

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/Build/Products/Release-iphoneos/OpenSidecariOS.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist"
          rm -rf Payload OpenDisplay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenDisplay-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 OpenDisplay-unsigned.ipa          

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-unsigned-ipa
          path: OpenDisplay-unsigned.ipa
          if-no-files-found: error
